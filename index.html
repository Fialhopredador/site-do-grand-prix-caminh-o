<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SIGLV — Sistema Integrado de Gestão e Liberação de Veículos"
  >

  <title>SIGLV — Sistema Integrado de Gestão e Liberação de Veículos</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./styles.css"
  >
</head>

<body>

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="brand">

      <div class="brand-icon">
        S
      </div>

      <div class="brand-text">

        <strong>
          SIGLV
        </strong>

        <span>
          Gestão Logística
        </span>

      </div>

    </div>


    <nav
      class="nav"
      id="nav"
    >

      <button
        class="active"
        data-page="dashboard"
      >
        <span>▦</span>
        Dashboard
      </button>

      <button
        data-page="agendamentos"
      >
        <span>▣</span>
        Agendamentos
      </button>

      <button
        data-page="operacao"
      >
        <span>🚛</span>
        Operação
      </button>

      <button
        data-page="docas"
      >
        <span>▤</span>
        Gestão de Docas
      </button>

      <button
        data-page="alertas"
      >
        <span>⚠</span>
        Alertas
      </button>

      <div class="nav-section">
        SIMULAÇÃO
      </div>

      <button
        data-page="simulacao"
      >
        <span>▶</span>
        Laboratório
      </button>

      <button
        data-page="cenarios"
      >
        <span>◫</span>
        Cenários "E se?"
      </button>

      <button
        data-page="gemeo"
      >
        <span>◇</span>
        Gêmeo Digital
      </button>

      <div class="nav-section">
        ANÁLISE
      </div>

      <button
        data-page="indicadores"
      >
        <span>▥</span>
        Indicadores
      </button>

      <button
        data-page="historico"
      >
        <span>↻</span>
        Histórico
      </button>

      <button
        data-page="configuracoes"
      >
        <span>⚙</span>
        Configurações
      </button>

    </nav>


    <div class="sidebar-bottom">

      <div class="demo-label">
        AMBIENTE DEMONSTRATIVO
      </div>

      <button
        class="reset-button"
        id="resetDemo"
      >
        ↻ Restaurar demonstração
      </button>

    </div>

  </aside>


  <!-- =====================================================
       CONTEÚDO PRINCIPAL
  ====================================================== -->

  <main class="main">

    <!-- TOPBAR -->

    <header class="topbar">

      <div class="topbar-left">

        <button
          class="hamb"
          id="hamb"
          aria-label="Abrir menu"
        >
          ☰
        </button>

        <div class="company-demo">

          <strong>
            Unidade Industrial
          </strong>

          <span>
            Ambiente de demonstração
          </span>

        </div>

      </div>


      <div class="topbar-right">

        <div class="system-status">

          <span class="status-dot"></span>

          Sistema operacional

        </div>

        <div class="user-avatar">
          G
        </div>

      </div>

    </header>


    <!-- ===================================================
         ÁREA ONDE O JAVASCRIPT CARREGA AS TELAS
    ==================================================== -->

    <section
      class="content"
      id="content"
    >

      <div class="loading-screen">

        <h2>
          Carregando SIGLV...
        </h2>

        <p>
          Inicializando sistema de gestão logística.
        </p>

      </div>

    </section>

  </main>


<!-- =====================================================
     MODAIS
====================================================== -->

<div id="modalRoot"></div>


<!-- =====================================================
     NOTIFICAÇÕES
====================================================== -->

<div
  id="toastRoot"
  class="toast-root"
></div>

  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    src="./app.js"
    defer
  ></script>

</body>

</html>
